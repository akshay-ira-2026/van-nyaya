name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dtype: [float32, bfloat16]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: nproc; free -g; lscpu | grep -i -E "model name|flags" | cut -c1-300
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q -U transformers peft accelerate
      - name: probe
        timeout-minutes: 28
        continue-on-error: true
        env: {DTYPE: "${{ matrix.dtype }}"}
        run: python scripts/probe.py
      - run: cat probe.json || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "probe-${{ matrix.dtype }}", path: probe.json, if-no-files-found: ignore}
